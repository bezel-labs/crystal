name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write # OIDC — authenticates to npm via Trusted Publishing (no NPM_TOKEN)

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # semantic-release writes its own `chore(release): x.y.z` commit, whose generated
      # changelog body exceeds commitlint's body-max-line-length. Skip installing husky's
      # commit-msg hook here — human commits are still linted locally and on PRs.
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@latest # OIDC Trusted Publishing needs npm >= 11.5.1
      - run: npm ci
      - run: npm run build
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
